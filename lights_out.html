<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lights Out</title>
</head>
<body onload="shuffle('easy', true)">
    <header>
        <h1 onclick="change_color()">Lights Out</h1>
        <p id="counter"></p>
    </header>
    <section id="difficulties">
        <button value="easy" onclick="shuffle(this.value, true)">Fácil</button>
        <button value="med" onclick="shuffle(this.value, true)">Médio</button>
        <button value="hard" onclick="shuffle(this.value, true)">Difícil</button>
    </section>
    <main>
        <section id="grid"></section>
        <button id="reset" onclick="shuffle(null, false)">Resetar jogo atual</button>
    </main>
    <div id="congratulations_back">
        <div id="congratulations">
            <div>
                <h1>Parabéns!</h1>
                <h2 id="clicks_win"></h2>
            </div>
            <button onclick="play_again(this.parentElement.parentElement.id)">Jogar Novamente</button>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
